<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Vertical Image Splitter Tool</title>
	<meta name="description"
		content="Use our Vertical Image Splitter Tool to instantly split images in half down the middle. Upload multiple images and download the bisected versions easily.">
	<meta name="keywords" content="vertical image splitter, split images in half, image processing, upload images, download images">
	<link rel="stylesheet" href="style.css">
	<script src="app.js" defer></script>
</head>

<body>
	<header>
		<h1>Vertical Image Splitter Tool</h1>
		<p>Note: Splitting a large number of images may affect browser performance.</p>
		<p>This tool runs entirely in your browser and does NOT upload or store any images.</p>
	</header>

	<main>
		<section>
			<h2>Upload Your Images</h2>
			<input type="file" id="fileInput" accept="image/*" multiple>
			<button id="splitBtn" disabled>Split Images Down the Middle</button>
			<button id="downloadBtn" disabled>Download Split Images</button>
		</section>

		<section id="thumbnails">
			<h2>Image Thumbnails</h2>
			<!-- Thumbnails will be displayed here -->
		</section>
	</main>

	<footer>
		<p>&copy; 2024 Vertical Image Splitter Tool. All rights reserved.</p>
	</footer>

</body>

</html>
